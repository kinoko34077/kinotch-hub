<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://kinoko34077.github.io; frame-src 'self' https://kinoko34077.github.io https://standby-display.kinotch.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
<title>KiNoTch. Hub</title></head>
<body><main id="home">
<header><div><h1>KiNoTch<span class="dot">.</span> Hub</h1></div></header>
<div id="apps" class="apps" aria-label="アプリ一覧"></div>
<p id="catalog-status" class="hint" role="status">公開カタログ取得中</p>
<button id="catalog-retry" type="button" hidden>再取得</button>
<p id="gesture-hint" class="hint" hidden>タップで開く · 長押し / 右クリックでメニュー</p>
<p id="feedback" role="status" aria-live="polite"></p>
<details id="repo-panel" hidden><summary id="repo-summary">公開リポジトリ</summary><ul id="repo-list"></ul></details>
<details><summary>使い方</summary><p>Safariの共有メニューから「ホーム画面に追加」。ホーム画面から起動し、アプリを選択してください。画面端の取っ手を内側へスライド（またはタップ）してホームボタンを表示します。取っ手は上下に移動でき、反対側まで長くドラッグすると左右端を切り替えられます。キーボードではShift+F10でもメニューを開けます。</p><p>Hub内で動作しない場合はホームに戻り、アプリの操作メニューからブラウザで開けます。</p></details>
</main>
<dialog id="app-menu" aria-labelledby="menu-title"><div class="menu-inner">
<h2 id="menu-title"></h2><p id="menu-note"></p>
<button id="menu-open" type="button"><span>開く</span><span aria-hidden="true">↗</span></button>
<button id="menu-share" type="button"><span>共有</span><span aria-hidden="true">⇧</span></button>
<a id="menu-browser" target="_blank" rel="noopener noreferrer"><span>ブラウザで開く</span><span aria-hidden="true">↗</span></a>
<div id="manual-share" hidden><label for="share-url">リンクをコピー</label><input id="share-url" readonly></div>
<button id="menu-cancel" type="button">キャンセル</button>
</div></dialog>
<section id="stage" hidden aria-label="起動中のアプリ"><div id="surface"></div><div id="home-dock" data-side="right"><button id="back" type="button" hidden aria-label="Hubへ戻る" title="Hubへ戻る">⌂</button><button id="home-handle" type="button" aria-controls="back" aria-expanded="false" aria-label="ホーム操作を展開" title="横にスライドして展開・上下に移動">‹</button></div></section>
<script src="catalog-runtime.js" defer></script>
<script src="app.js" defer></script></body></html>
