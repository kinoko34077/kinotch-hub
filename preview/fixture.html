<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動作確認</title><style>body{font:16px system-ui;margin:16px;color:#111827}input,button{font:inherit;padding:8px;max-width:100%}output{display:block;margin:12px 0}</style></head><body><h2>Hub内起動の確認</h2><label>入力テスト <input id="draft" autocomplete="off"></label><p><button id="check">動作確認</button></p><output id="result"></output><script>document.querySelector('#check').onclick=()=>{let storage=false,parentAccess=false;try{localStorage.setItem('probe','1');storage=true}catch{}try{parentAccess=!!parent.document.body}catch{}document.querySelector('#result').textContent=JSON.stringify({storage,parentAccess});};</script></body></html>
