name: catalog-contract
on:
  pull_request:
    branches: [main]
    paths: ['schemas/**', 'tests/test_catalog*.py', 'tests/test_collect_catalog.py', 'tools/collect_catalog.py', 'catalog/**', '.github/workflows/catalog-contract.yml']
  push:
    branches: [main]
    paths: ['schemas/**', 'tests/test_catalog*.py', 'tests/test_collect_catalog.py', 'tools/collect_catalog.py', 'catalog/**', '.github/workflows/catalog-contract.yml']
permissions: {}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format-nongpl]==4.26.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kinoko34077/devflow
          ref: ad893e2299f0f89dc7b2d32681f0679e78282c6d
          path: .shared/devflow
          persist-credentials: false
          sparse-checkout: devflow_mapped_read
      - name: Catalog tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.shared/devflow
        run: python -m unittest discover -s tests -v
