name: preview-pages
on:
  pull_request:
    branches: [main]
    paths: ['preview/**', 'spikes/test_ios_preview.py', 'tools/collect_catalog.py', 'tests/**', 'schemas/**', 'catalog/**', '.github/workflows/preview-pages.yml']
  push:
    branches: [main]
    paths: ['preview/**', 'spikes/test_ios_preview.py', 'tools/collect_catalog.py', 'tests/**', 'schemas/**', 'catalog/**', '.github/workflows/preview-pages.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kinoko34077/devflow
          ref: ad893e2299f0f89dc7b2d32681f0679e78282c6d
          path: .shared/devflow
          persist-credentials: false
          sparse-checkout: devflow_mapped_read
      - run: python -m pip install 'jsonschema[format-nongpl]==4.26.0'
      - name: Validate public catalog
        env:
          PYTHONPATH: ${{ github.workspace }}/.shared/devflow
        run: python -m unittest discover -s tests -v
      - name: Generate validated public catalog
        env:
          PYTHONPATH: ${{ github.workspace }}/.shared/devflow
        run: python tools/collect_catalog.py --output preview/catalog.json
      - if: github.event_name != 'schedule'
        run: python -m pip install 'playwright==1.65.2'
      - if: github.event_name != 'schedule'
        run: python -m playwright install --with-deps chromium
      - if: github.event_name != 'schedule'
        run: python spikes/test_ios_preview.py
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: preview
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
